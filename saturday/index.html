<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#17211f;--muted:#586764;--line:#d3dcd9;--accent:#0e6e5f;--err:#b42318}
@media (prefers-color-scheme: dark){:root{--bg:#0e1514;--card:#162020;--ink:#e2eae8;--muted:#93a39f;--line:#2d3b39;--accent:#45b8a2;--err:#f38a7f}}

.box{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-left:max(16px,calc(50% - 190px));margin-right:max(16px,calc(50% - 190px))}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:var(--muted)}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
label{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:1.2em}
</style></head><body>

function show(buf){var h=new TextDecoder().decode(buf);document.open();document.write(h);document.close();}
