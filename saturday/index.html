var K='satboard.key.DY0VZ/yK', BK='satboard.bk', BKR='satboard.bk.r';
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function show(buf){var h=new TextDecoder().decode(buf);document.open();document.write(h);document.close();}
function dec(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},k,u8(D.c));});}
function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(b){return crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},b,256);});}
var e=document.getElementById('e');
if(!window.crypto||!crypto.subtle){e.textContent='This browser cannot open the board. Use a current Chrome or Edge.';return;}
try{var saved=localStorage.getItem(K);if(saved){var bkr=localStorage.getItem(BKR);if(bkr){try{sessionStorage.setItem(BK,bkr);}catch(x){}}dec(u8(saved)).then(show).catch(function(){try{localStorage.removeItem(K);}catch(x){}});}}catch(x){}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();e.textContent='Opening...';
var pw=document.getElementById('pw').value,rem=document.getElementById('rem').checked;
function enc(raw){var b=new Uint8Array(raw),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function boardKey(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(b){return crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('satboard-boards-v1'),iterations:250000,hash:'SHA-256'},b,256);});}
derive(pw).then(function(raw){return dec(raw).then(function(buf){

if(rem){try{localStorage.setItem(K,enc(raw));localStorage.setItem(BKR,bks);}catch(x){}}
show(buf);});});}).catch(function(){e.textContent='That passcode is not right. Try again.';});});
